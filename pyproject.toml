[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-host"
version = "0.3.2"
description = "Colosseum host prerequisites and local telemetry plugin"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "colosseum-core>=0.15,<0.16",
  "pyserial>=3.5,<4",
  "pyvisa>=1.15,<2; python_version >= '3.10'",
  "pyvisa>=1.14,<1.15; python_version < '3.10'",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
static = ["mypy>=1.11", "ruff>=0.8"]

[project.entry-points."colosseum.plugins"]
host = "colosseum_host:register"

[tool.setuptools.packages.find]
include = ["colosseum_host*"]

[tool.setuptools.package-data]
colosseum_host = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["colosseum_host"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum_host"]
exclude = ["tests/", "build/", "examples/"]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["colosseum", "colosseum.*", "pyvisa.*", "serial.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "colosseum_host.api.bench",
  "colosseum_host.api.config",
  "colosseum_host.api.net",
  "colosseum_host.api.proc",
  "colosseum_host.api.sample",
  "colosseum_host.api.system",
]
disallow_untyped_decorators = false
