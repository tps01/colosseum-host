name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: colosseum-host
      - uses: actions/checkout@v7
        with:
          repository: tps01/colosseum-core
          ref: develop
          path: colosseum-core
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        working-directory: colosseum-host
        run: |
          python -m pip install --upgrade pip
          python -m pip install ../colosseum-core
          python -m pip install .
          python -m pip install "pytest>=8.0"
          python -m pip check
      - name: Smoke test installed runtime
        working-directory: colosseum-host
        run: python -I -c "import colosseum_host, pyvisa, serial"
      - name: Test
        working-directory: colosseum-host
        run: python -m pytest -q

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: colosseum-host
      - uses: actions/checkout@v7
        with:
          repository: tps01/colosseum-core
          ref: develop
          path: colosseum-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and tools
        working-directory: colosseum-host
        run: |
          python -m pip install --upgrade pip
          python -m pip install ../colosseum-core
          python -m pip install .
          python -m pip install "ruff>=0.8" "mypy>=1.11"
      - name: Lint
        working-directory: colosseum-host
        run: ruff check colosseum_host tests examples
      - name: Type check
        working-directory: colosseum-host
        run: mypy
