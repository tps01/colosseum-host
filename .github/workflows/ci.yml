name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: colosseum-host
      - uses: actions/checkout@v7
        with:
          repository: tps01/colosseum-core
          ref: develop
          path: colosseum-core
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        working-directory: colosseum-host
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../colosseum-core
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Smoke test installed runtime
        working-directory: colosseum-host
        run: python -I -c "import colosseum_host, pyvisa, serial"
      - name: Test
        working-directory: colosseum-host
        run: python -m pytest -q

  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: colosseum-host
      - uses: actions/checkout@v7
        with:
          repository: tps01/colosseum-core
          ref: develop
          path: colosseum-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and tools
        working-directory: colosseum-host
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../colosseum-core
          python -m pip install -r requirements.txt
      - name: Lint
        working-directory: colosseum-host
        run: ruff check colosseum_host tests examples
      - name: Type check
        working-directory: colosseum-host
        run: mypy

  # Confirm the API pages build. Publishing stays on the develop pages workflow.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: colosseum-host
      - uses: actions/checkout@v7
        with:
          repository: tps01/colosseum-core
          ref: develop
          path: colosseum-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        working-directory: colosseum-host
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install --upgrade pip
          python -m pip install "sphinx>=7.0,<9"
          python -m pip install -e ../colosseum-core
          python -m pip install -r requirements.txt
      - name: Build documentation
        working-directory: colosseum-host
        run: python scripts/build_pages.py
